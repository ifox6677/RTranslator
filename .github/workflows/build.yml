name: Android Build (APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 可选：加速 Gradle
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 如果你项目没有 wrapper，必须先加上；一般都有 ./gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 如果你工程用到了 CMake/NDK，这一步通常不必装（AGP 会自动下载需要的）
      # 但如果你想强制更稳定，可以启用下面这一段（需要你在 local.properties 或 gradle 里配置 ndkVersion）
      # - name: Install Android SDK components
      #   uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Find Debug APK
        id: find_debug_apk
        run: |
          apk=$(find app/build/outputs -type f -name "*debug*.apk" | head -n 1 || true)
          if [ -z "$apk" ]; then
            echo "No debug APK found. Listing outputs:"
            ls -R app/build/outputs || true
            exit 1
          fi
          echo "debug_apk=$apk" >> $GITHUB_OUTPUT
          echo "Found: $apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ${{ steps.find_debug_apk.outputs.debug_apk }}

      # 如果你也想构建 Release（你 build.gradle 里 release 用 debug 签名，所以能打出 release APK）
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Find Release APK
        id: find_release_apk
        run: |
          apk=$(find app/build/outputs -type f -name "*release*.apk" | head -n 1 || true)
          if [ -z "$apk" ]; then
            echo "No release APK found. Listing outputs:"
            ls -R app/build/outputs || true
            exit 1
          fi
          echo "release_apk=$apk" >> $GITHUB_OUTPUT
          echo "Found: $apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: ${{ steps.find_release_apk.outputs.release_apk }}
